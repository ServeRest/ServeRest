name: Deploy ServeRest on the web

# This pipeline runs when the continuous_delivery.yml pipeline generates a new release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency: ${{ github.workflow }}

env:
  # Google Cloud Run variables
  IMAGE_PROJECT_ID: serverest
  IMAGE_SERVICE_NAME: app
  REGION: us-central1
  SERVICE_PRODUCTION: app
  SERVICE_STAGING: app-staging
  URL_PRODUCTION: https://serverest.dev
  # Piso de testes passando do E2E no staging e na revisão nova; subir quando a suíte crescer (352 em 18/11/2026).
  E2E_MIN_PASSING: 340
  # Datadog variables
  DD_SERVICE: serverest
  DD_SITE: datadoghq.eu

jobs:
  build-and-push-image-to-gcloud-container-registry:
    name: Build and push image to gcloud container registry
    runs-on: ubuntu-22.04

    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GCP_IAM_SERVICE_ACCOUNT_KEY: op://CI-CD/google-cloud/SERVICE_ACCOUNT_KEY
    - name: Project checkout
      uses: actions/checkout@v7
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
    - name: Authentication on GCloud
      run: |
        echo $GCP_IAM_SERVICE_ACCOUNT_KEY > gcloud-service-key.json
        gcloud auth activate-service-account --key-file gcloud-service-key.json
      env:
        GCP_IAM_SERVICE_ACCOUNT_KEY: ${{ env.GCP_IAM_SERVICE_ACCOUNT_KEY }}
    - run: gcloud config set project serverest
    - name: Build and push image to gcloud container registry
      run: |
        gcloud builds submit . \
          --config=.github/cloudbuild.yaml \
          --substitutions=COMMIT_SHA=${{ github.sha }},_VERSION=${{ github.ref_name }},_PROJECT_ID=$IMAGE_PROJECT_ID,_SERVICE_NAME=$IMAGE_SERVICE_NAME

  deploy-staging:
    name: Deploy on staging environment (staging.serverest.dev)
    needs: build-and-push-image-to-gcloud-container-registry

    runs-on: ubuntu-22.04
    environment: staging

    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GCP_IAM_SERVICE_ACCOUNT_KEY: op://CI-CD/google-cloud/SERVICE_ACCOUNT_KEY
        DD_API_KEY: op://CI-CD/Datadog/DD_API_KEY
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
    - name: Authentication on GCloud
      run: |
        echo $GCP_IAM_SERVICE_ACCOUNT_KEY > gcloud-service-key.json
        gcloud auth activate-service-account --key-file gcloud-service-key.json
      env:
        GCP_IAM_SERVICE_ACCOUNT_KEY: ${{ env.GCP_IAM_SERVICE_ACCOUNT_KEY }}
    - run: gcloud config set project serverest
    - name: Deploy container image to 'staging' environment
      run: |
        ENV_VARS="^@^ENVIRONMENT=$ENVIRONMENT@DD_SERVICE=$DD_SERVICE@DD_ENV=$ENVIRONMENT@DD_SITE=$DD_SITE"
        ENV_VARS="$ENV_VARS@DD_API_KEY=$DD_API_KEY@DD_VERSION=${{ github.ref_name }}"
        ENV_VARS="$ENV_VARS@DD_TAGS=git.commit.sha:${{ github.sha }},git.repository_url:github.com/ServeRest/ServeRest"
        ENV_VARS="$ENV_VARS@DD_LOGS_INJECTION=true@DD_RUNTIME_METRICS_ENABLED=true@DD_LOGS_ENABLED=false"
        ENV_VARS="$ENV_VARS@DD_PROFILING_ENABLED=false@DD_PROFILING_EXPERIMENTAL_CPU_ENABLED=false@DD_APPSEC_ENABLED=false"

        # --remove-env-vars apaga do serviço uma variável que saiu do ENV_VARS (update-env-vars não apaga).
        # Pode sair depois que staging e produção receberem um deploy com ela.
        gcloud run \
          deploy $SERVICE_STAGING \
          --image gcr.io/$IMAGE_PROJECT_ID/$IMAGE_SERVICE_NAME:${{ github.sha }} \
          --region $REGION \
          --concurrency=80 \
          --timeout=60s \
          --update-env-vars="$ENV_VARS" \
          --remove-env-vars=DD_TRACE_HEADER_TAGS
      env:
        DD_API_KEY: ${{ env.DD_API_KEY }}
        ENVIRONMENT: staging.serverest.dev
    - name: Update staging traffic to latest revision
      run: |
        gcloud run \
          services update-traffic $SERVICE_STAGING \
          --region $REGION \
          --to-latest

  test-e2e-staging:
    name: E2E test on staging environment
    needs: deploy-staging

    runs-on: ubuntu-22.04

    steps:
    - name: Project checkout
      uses: actions/checkout@v7
    - run: docker compose build test-e2e-staging
    - name: Run E2E test in staging environment
      # O código de saída do compose não basta: uma suíte que roda poucos testes também sai com 0.
      run: |
        set -o pipefail
        make test-e2e-staging 2>&1 | tee e2e.log
        bash .github/scripts/conferir-testes-e2e.sh e2e.log "$E2E_MIN_PASSING"

  open-issue-staging:
    name: Open issue when staging test fail
    needs: test-e2e-staging
    if: failure()

    runs-on: ubuntu-22.04

    steps:
    - name: Create issue
      run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee PauloGoncalvesBH --label bug
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: Staging tests failed - Deploy aborted
        BODY: |
          _This is an automatically generated issue_

          The attempt to deploy the `${{ github.ref }}` tag failed. Staging tests failed and because of that the version `${{ github.ref }}` was not sent to production.

          ## Context

          |                           | Detail                                                                        	|
          |--------------------------	|-------------------------------------------------------------------------------	|
          | **Failed Run**    	      | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} 	|
          | **Codebase**      	      | https://github.com/${{ github.repository }}/tree/${{ github.sha }}            	|
          | **Workflow name**       	| `${{ github.workflow }}`                                                      	|
          | **Tag**                  	| `${{ github.ref }}`                                                           	|
          | **Environment affected** 	| https://staging.serverest.dev/                                                	|

  # Produção \/
  # A revisão nova sobe sem tráfego, com a tag canario, passa pelo E2E completo na URL da tag, pela conferência
  # da semente e pela conferência de OOM e 5xx nos logs dela. Só depois recebe o tráfego; a conferência de
  # roteamento só prova que serverest.dev serve a revisão nova, e a vigia de 60 min roda à parte, em
  # vigiar-producao.yml.
  # Não é um canário por porcentagem: cada instância tem o seu NeDB em memória, então um POST numa revisão
  # e o GET seguinte na outra dariam 404. O rollback volta para a revisão que servia 100% antes do deploy.
  deploy-production:
    name: Deploy on prod environment without traffic (serverest.dev)
    needs: test-e2e-staging
    if: "!contains(github.ref, 'beta')"

    runs-on: ubuntu-22.04
    environment: production
    permissions:
      actions: write
      contents: read

    outputs:
      previous-revision: ${{ steps.previous.outputs.revision }}
      new-revision: ${{ steps.new.outputs.revision }}
      canary-url: ${{ steps.new.outputs.url }}
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Project checkout
      uses: actions/checkout@v7
    - name: Read the release version from package.json
      id: version
      # Do commit do deploy, e não do nome da tag: um workflow_dispatch manual na trunk também tem a versão certa.
      run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
    - name: Cancel the running watch of this service
      # Uma vigia antiga ainda rodando poderia reverter para a revisão anterior dela no meio deste deploy, ou
      # depois de ele ler a revisão que serve 100%. A vigia cancelada não reverte, e o deploy só segue
      # quando ela terminou.
      run: |
        RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow vigiar-producao.yml --limit 20 \
          --json databaseId,status,displayTitle \
          --jq ".[] | select(.status != \"completed\" and (.displayTitle | startswith(\"Vigia de $SERVICE_PRODUCTION:\"))) | .databaseId")
        if [ -z "$RUNS" ]; then
          echo "Nenhuma vigia de $SERVICE_PRODUCTION rodando ou na fila"
          exit 0
        fi
        for RUN in $RUNS; do
          echo "Cancelando a vigia https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN"
          gh run cancel "$RUN" --repo "$GITHUB_REPOSITORY" || true
        done
        for RUN in $RUNS; do
          for _ in $(seq 1 30); do
            [ "$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)" = completed ] && break
            sleep 10
          done
          CONCLUSION=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
          echo "Vigia $RUN: $CONCLUSION"
          if [ "${CONCLUSION%% *}" != completed ]; then
            echo "::error::A vigia $RUN não terminou em 5 min; deploy abortado"
            exit 1
          fi
        done
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GCP_IAM_SERVICE_ACCOUNT_KEY: op://CI-CD/google-cloud/SERVICE_ACCOUNT_KEY
        DD_API_KEY: op://CI-CD/Datadog/DD_API_KEY
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
    - name: Authentication on GCloud
      run: |
        echo "$GCP_IAM_SERVICE_ACCOUNT_KEY" > gcloud-service-key.json
        gcloud auth activate-service-account --key-file gcloud-service-key.json
      env:
        GCP_IAM_SERVICE_ACCOUNT_KEY: ${{ env.GCP_IAM_SERVICE_ACCOUNT_KEY }}
    - run: gcloud config set project serverest
    - name: Read the revision serving 100% before the deploy
      id: previous
      # Sem ela não há para onde voltar: melhor não fazer o deploy.
      run: |
        PREVIOUS=$(gcloud run services describe "$SERVICE_PRODUCTION" --region "$REGION" --format=json \
          | jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName] | if length == 1 then .[0] else "" end')
        if [ -z "$PREVIOUS" ]; then
          echo "::error::Nenhuma revisão com 100% do tráfego; deploy abortado"
          exit 1
        fi
        echo "Revisão anterior: $PREVIOUS"
        echo "revision=$PREVIOUS" >> "$GITHUB_OUTPUT"
    - name: Deploy container image to 'production' environment without traffic
      run: |
        ENV_VARS="^@^ENVIRONMENT=$ENVIRONMENT@DD_SERVICE=$DD_SERVICE@DD_ENV=$ENVIRONMENT@DD_SITE=$DD_SITE"
        ENV_VARS="$ENV_VARS@DD_API_KEY=$DD_API_KEY@DD_VERSION=${{ github.ref_name }}"
        ENV_VARS="$ENV_VARS@DD_TAGS=git.commit.sha:${{ github.sha }},git.repository_url:github.com/ServeRest/ServeRest"
        ENV_VARS="$ENV_VARS@DD_LOGS_INJECTION=true@DD_RUNTIME_METRICS_ENABLED=true@DD_LOGS_ENABLED=false"
        ENV_VARS="$ENV_VARS@DD_PROFILING_ENABLED=false@DD_PROFILING_EXPERIMENTAL_CPU_ENABLED=false@DD_APPSEC_ENABLED=false"

        # --remove-env-vars apaga do serviço uma variável que saiu do ENV_VARS (update-env-vars não apaga).
        # Pode sair depois que staging e produção receberem um deploy com ela.
        # --no-traffic: o serviço deixa de seguir a última revisão; a promoção é explícita, mais abaixo.
        gcloud run \
          deploy "$SERVICE_PRODUCTION" \
          --image "gcr.io/$IMAGE_PROJECT_ID/$IMAGE_SERVICE_NAME:${{ github.sha }}" \
          --region "$REGION" \
          --concurrency=80 \
          --timeout=60s \
          --update-env-vars="$ENV_VARS" \
          --remove-env-vars=DD_TRACE_HEADER_TAGS \
          --no-traffic \
          --tag canario
      env:
        DD_API_KEY: ${{ env.DD_API_KEY }}
        ENVIRONMENT: serverest.dev
    - name: Read the new revision and the canary tag URL
      id: new
      run: |
        TRAFFIC=$(gcloud run services describe "$SERVICE_PRODUCTION" --region "$REGION" --format=json | jq '.status.traffic')
        echo "$TRAFFIC"
        NEW=$(jq -r '.[] | select(.tag == "canario") | .revisionName' <<< "$TRAFFIC")
        URL=$(jq -r '.[] | select(.tag == "canario") | .url' <<< "$TRAFFIC")
        if [ -z "$NEW" ] || [ -z "$URL" ] || [ "$NEW" = "$PREVIOUS" ]; then
          echo "::error::Revisão nova '$NEW' (URL '$URL') ausente ou igual à anterior '$PREVIOUS'"
          exit 1
        fi
        echo "revision=$NEW" >> "$GITHUB_OUTPUT"
        echo "url=$URL" >> "$GITHUB_OUTPUT"
      env:
        PREVIOUS: ${{ steps.previous.outputs.revision }}

  test-e2e-canary:
    name: E2E test on the new revision, before it gets traffic
    needs: deploy-production

    runs-on: ubuntu-22.04

    outputs:
      finished-at: ${{ steps.seed.outputs.finished-at }}
      # O resultado de cada conferência, para a issue dizer qual falhou.
      e2e: ${{ steps.e2e.outcome }}
      seed: ${{ steps.seed.outcome }}

    steps:
    - name: Project checkout
      uses: actions/checkout@v7
    - run: docker compose build test-e2e-canary
    - name: Wait for the new revision on the canary tag URL
      run: bash .github/scripts/esperar-versao.sh "$SERVEREST_URL" "$VERSION"
      env:
        SERVEREST_URL: ${{ needs.deploy-production.outputs.canary-url }}
        VERSION: ${{ needs.deploy-production.outputs.version }}
    - name: Run E2E test on the canary tag URL
      id: e2e
      # A suíte inteira, a mesma do staging, mas com a configuração do serviço de produção e o ENVIRONMENT
      # serverest.dev: robots, sitemap e canonical só têm a forma de produção aqui. A limpeza do fim apaga o
      # que a suíte cadastrou; o passo seguinte confere que nada sobrou.
      run: |
        set -o pipefail
        make test-e2e-canary 2>&1 | tee e2e.log
        bash .github/scripts/conferir-testes-e2e.sh e2e.log "$E2E_MIN_PASSING"
      env:
        SERVEREST_URL: ${{ needs.deploy-production.outputs.canary-url }}
    - name: Check that the new revision holds only the seed data
      id: seed
      # A instância que passou pelo E2E é a que recebe o tráfego: um cadastro que a limpeza não apagou, ou um
      # registro da semente que um teste apagou ou alterou, iria para a produção. Fica neste job porque ele tem o
      # checkout com src/data, de onde sai a semente esperada. Roda também depois de um E2E que falhou, para a
      # issue dizer se sobrou dado. É a última requisição à revisão: a espera dos logs conta a partir daqui.
      if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
      run: |
        bash .github/scripts/conferir-semente.sh "$SERVEREST_URL"
        echo "finished-at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      env:
        SERVEREST_URL: ${{ needs.deploy-production.outputs.canary-url }}

  check-logs-canary:
    name: Check the new revision logs for OOM and 5xx, before it gets traffic
    # A vigia só conta os sinais desde a promoção: um OOM ou um 5xx durante o E2E ficaria de fora dela. Uma
    # linha de OOM basta para não promover, o mesmo critério que reverte na vigia
    # (.github/scripts/vigiar-revisao.sh). Uma resposta 5xx também basta, enquanto a vigia tolera até 4 vindas
    # do público: nenhum teste do E2E provoca 5xx de propósito (os que provocam usam stub e são @skipE2E),
    # então aqui um 5xx é defeito. Sem conseguir ler os logs também não promove: aqui não promover é seguro,
    # a produção segue na anterior.
    needs: [deploy-production, test-e2e-canary]

    runs-on: ubuntu-22.04

    outputs:
      # O resultado de cada conferência, para a issue dizer qual falhou.
      oom: ${{ steps.oom.outcome }}
      errors-5xx: ${{ steps.errors-5xx.outcome }}

    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GCP_IAM_SERVICE_ACCOUNT_KEY: op://CI-CD/google-cloud/SERVICE_ACCOUNT_KEY
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
    - name: Authentication on GCloud
      run: |
        echo "$GCP_IAM_SERVICE_ACCOUNT_KEY" > gcloud-service-key.json
        gcloud auth activate-service-account --key-file gcloud-service-key.json
      env:
        GCP_IAM_SERVICE_ACCOUNT_KEY: ${{ env.GCP_IAM_SERVICE_ACCOUNT_KEY }}
    - run: gcloud config set project serverest
    - name: Wait for the logs and read the new revision creation
      id: creation
      # Os logs chegam cerca de 40 s depois do evento: espera 90 s desde a última requisição à revisão, como
      # o último ciclo da vigia.
      run: |
        ESPERA=$((FINISHED_AT + 90 - $(date -u +%s)))
        if [ "$ESPERA" -gt 0 ]; then sleep "$ESPERA"; fi
        CRIADA=$(gcloud run revisions describe "$NEW" --region "$REGION" --format 'value(metadata.creationTimestamp)')
        if [ -z "$CRIADA" ]; then
          echo "::error::Não foi possível ler a criação da revisão $NEW; promoção abortada"
          exit 1
        fi
        echo "created-at=$CRIADA" >> "$GITHUB_OUTPUT"
      env:
        NEW: ${{ needs.deploy-production.outputs.new-revision }}
        FINISHED_AT: ${{ needs.test-e2e-canary.outputs.finished-at }}
    - name: Look for "Memory limit of" in the new revision logs since its creation
      id: oom
      run: |
        FILTRO="resource.type=\"cloud_run_revision\" resource.labels.service_name=\"$SERVICE_PRODUCTION\""
        FILTRO="$FILTRO resource.labels.revision_name=\"$NEW\" timestamp>=\"$CRIADA\" textPayload:\"Memory limit of\""
        if ! OOM=$(gcloud logging read "$FILTRO" --project "$IMAGE_PROJECT_ID" --limit 1 --format 'value(timestamp)'); then
          echo "::error::A leitura dos logs de OOM da revisão $NEW falhou; promoção abortada"
          exit 1
        fi
        if [ -n "$OOM" ]; then
          echo "::error::Linha de OOM (Memory limit of) na revisão $NEW em $OOM; promoção abortada"
          exit 1
        fi
        echo "Nenhuma linha de OOM na revisão $NEW desde $CRIADA"
      env:
        NEW: ${{ needs.deploy-production.outputs.new-revision }}
        CRIADA: ${{ steps.creation.outputs.created-at }}
    - name: Look for responses with status 500 or above in the new revision logs since its creation
      id: errors-5xx
      # Roda mesmo depois de um OOM, para a issue dizer se também houve 5xx. O filtro é o da vigia.
      if: ${{ !cancelled() && steps.creation.outcome == 'success' }}
      run: |
        FILTRO="resource.type=\"cloud_run_revision\" resource.labels.service_name=\"$SERVICE_PRODUCTION\""
        FILTRO="$FILTRO resource.labels.revision_name=\"$NEW\" timestamp>=\"$CRIADA\""
        FILTRO="$FILTRO log_name=\"projects/$IMAGE_PROJECT_ID/logs/run.googleapis.com%2Frequests\" httpRequest.status>=500"
        if ! ERROS=$(gcloud logging read "$FILTRO" --project "$IMAGE_PROJECT_ID" --limit 20 \
          --format 'value(timestamp,httpRequest.status,httpRequest.requestMethod,httpRequest.requestUrl)'); then
          echo "::error::A leitura dos logs de 5xx da revisão $NEW falhou; promoção abortada"
          exit 1
        fi
        if [ -n "$ERROS" ]; then
          echo "$ERROS"
          echo "::error::$(printf '%s\n' "$ERROS" | grep -c .) resposta(s) 5xx na revisão $NEW (até 20 listadas); promoção abortada"
          exit 1
        fi
        echo "Nenhuma resposta 5xx na revisão $NEW desde $CRIADA"
      env:
        NEW: ${{ needs.deploy-production.outputs.new-revision }}
        CRIADA: ${{ steps.creation.outputs.created-at }}

  open-issue-canary:
    name: Open issue when a check on the new revision fails
    needs: [deploy-production, test-e2e-canary, check-logs-canary]
    if: ${{ failure() && (needs.test-e2e-canary.result == 'failure' || needs.check-logs-canary.result == 'failure') }}

    runs-on: ubuntu-22.04

    steps:
    - name: Create issue
      # Cada conferência entra na issue com o seu resultado. Um job que falha antes das conferências (o build
      # da imagem de teste, a espera da versão, a autenticação no GCloud) deixa as dele sem resultado.
      run: |
        resultado () {
          case "$1" in
            success) echo passou ;;
            failure) echo '**falhou**' ;;
            *) echo 'não rodou' ;;
          esac
        }
        FALHAS=()
        [ "$E2E" = failure ] && FALHAS+=('o teste E2E')
        [ "$SEED" = failure ] && FALHAS+=('a conferência da semente')
        [ "$OOM" = failure ] && FALHAS+=('a conferência de OOM nos logs')
        [ "$ERRORS_5XX" = failure ] && FALHAS+=('a conferência de 5xx nos logs')
        if [ "${#FALHAS[@]}" -eq 0 ]; then
          [ "$E2E_JOB" = failure ] && FALHAS+=('o job do E2E antes do teste')
          [ "$LOGS_JOB" = failure ] && FALHAS+=('a leitura dos logs')
        fi
        LISTA=$(printf '%s, ' "${FALHAS[@]}")
        LISTA=${LISTA%, }
        LISTA=${LISTA:-uma conferência}
        TITLE="Revisão nova reprovada antes do tráfego, produção não foi tocada"
        BODY=$(cat <<EOF
        _Issue gerada automaticamente_

        Falhou $LISTA na revisão nova \`$NEW\`, antes de ela receber tráfego. A produção não foi tocada: o tráfego continua na revisão \`$PREVIOUS\`.

        | Conferência | Resultado |
        |---|---|
        | E2E completo na URL da tag, com $E2E_MIN_PASSING testes passando no mínimo | $(resultado "$E2E") |
        | Só a semente na instância depois do E2E | $(resultado "$SEED") |
        | Nenhuma linha de OOM nos logs da revisão | $(resultado "$OOM") |
        | Nenhuma resposta 5xx nos logs da revisão | $(resultado "$ERRORS_5XX") |

        | | Detalhe |
        |---|---|
        | **Run** | $RUN_URL |
        | **Codebase** | $CODEBASE_URL |
        | **Tag** | \`$GITHUB_REF\` |
        EOF
        )
        gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee PauloGoncalvesBH --label bug
      env:
        GH_TOKEN: ${{ github.token }}
        NEW: ${{ needs.deploy-production.outputs.new-revision }}
        PREVIOUS: ${{ needs.deploy-production.outputs.previous-revision }}
        E2E_JOB: ${{ needs.test-e2e-canary.result }}
        LOGS_JOB: ${{ needs.check-logs-canary.result }}
        E2E: ${{ needs.test-e2e-canary.outputs.e2e }}
        SEED: ${{ needs.test-e2e-canary.outputs.seed }}
        OOM: ${{ needs.check-logs-canary.outputs.oom }}
        ERRORS_5XX: ${{ needs.check-logs-canary.outputs.errors-5xx }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CODEBASE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}

  promote-production:
    name: Promote the new revision to 100% of production traffic
    needs: [deploy-production, test-e2e-canary, check-logs-canary]

    runs-on: ubuntu-22.04
    environment: production

    outputs:
      promoted-at: ${{ steps.promote.outputs.promoted-at }}

    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GCP_IAM_SERVICE_ACCOUNT_KEY: op://CI-CD/google-cloud/SERVICE_ACCOUNT_KEY
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
    - name: Authentication on GCloud
      run: |
        echo "$GCP_IAM_SERVICE_ACCOUNT_KEY" > gcloud-service-key.json
        gcloud auth activate-service-account --key-file gcloud-service-key.json
      env:
        GCP_IAM_SERVICE_ACCOUNT_KEY: ${{ env.GCP_IAM_SERVICE_ACCOUNT_KEY }}
    - run: gcloud config set project serverest
    - name: Update production traffic to the new revision
      id: promote
      # A vigia conta os sinais a partir daqui; a hora sai antes da troca para não perder o começo.
      run: |
        echo "promoted-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        gcloud run \
          services update-traffic "$SERVICE_PRODUCTION" \
          --region "$REGION" \
          --to-revisions "$NEW=100"
      env:
        NEW: ${{ needs.deploy-production.outputs.new-revision }}

  check-routing-production:
    name: Check that serverest.dev serves the new revision
    # O E2E completo já rodou na revisão nova pela URL da tag. Aqui só falta provar o que a URL da tag não prova: o
    # domínio, o TLS e a troca de tráfego. Só leitura, para não gravar dado de teste na produção; a lista vem
    # filtrada pelo _id do usuário da semente, que responde 200 mesmo sem ele, para não baixar a lista inteira.
    needs: [deploy-production, promote-production]

    runs-on: ubuntu-22.04

    steps:
    - name: Project checkout
      uses: actions/checkout@v7
    - name: Wait for the new revision on the public URL
      run: bash .github/scripts/esperar-versao.sh "$URL_PRODUCTION" "$VERSION"
      env:
        VERSION: ${{ needs.deploy-production.outputs.version }}
    - name: Read a list through the public URL
      run: |
        curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors \
          -o /dev/null -w 'GET /usuarios: %{http_code}\n' "$URL_PRODUCTION/usuarios?_id=0uxuPY0cbmQhpEz1"

  start-watch-production:
    name: Start the 60-minute watch of the new revision
    # A vigia roda em outro workflow, com o seu grupo de concorrência: aqui ela prenderia a fila do deploy por
    # 60 min, e o GitHub guarda só um run pendente por grupo, então um release beta cancelaria a promoção
    # pendente de um release de trunk. Se o disparo falhar, a revisão nova fica sem vigia: o job falha à vista.
    needs: [deploy-production, promote-production, check-routing-production]

    runs-on: ubuntu-22.04
    permissions:
      actions: write

    steps:
    - name: Dispatch vigiar-producao.yml
      run: |
        gh workflow run vigiar-producao.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
          -f servico="$SERVICE_PRODUCTION" -f revisao="$NEW" -f anterior="$PREVIOUS" \
          -f versao="$VERSION" -f promovido_em="$PROMOTED_AT"
      env:
        GH_TOKEN: ${{ github.token }}
        NEW: ${{ needs.deploy-production.outputs.new-revision }}
        PREVIOUS: ${{ needs.deploy-production.outputs.previous-revision }}
        VERSION: ${{ needs.deploy-production.outputs.version }}
        PROMOTED_AT: ${{ needs.promote-production.outputs.promoted-at }}

  open-issue-production:
    name: Open issue when the promotion or the production routing check fail
    needs: [deploy-production, promote-production, check-routing-production]
    if: ${{ failure() && (needs.promote-production.result == 'failure' || needs.check-routing-production.result == 'failure') }}

    runs-on: ubuntu-22.04

    outputs:
      issue-number: ${{ steps.create-issue-action.outputs.number }}

    steps:
    - name: Create issue
      id: create-issue-action
      # O rollback não depende desta issue: uma falha aqui não pode deixar a produção na versão quebrada.
      continue-on-error: true
      run: |
        url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee PauloGoncalvesBH --label bug)
        number="${url##*/}"
        if [[ "$number" =~ ^[0-9]+$ ]]; then
          echo "number=$number" >> "$GITHUB_OUTPUT"
        fi
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: ${{ needs.promote-production.result == 'failure' && 'Production promotion failed. Deploy reverted' || 'Production routing check failed. Deploy reverted' }}
        BODY: |
          _This is an automatically generated issue_

          The attempt to deploy the `${{ github.ref }}` tag failed. ${{ needs.promote-production.result == 'failure' && 'The traffic update to the new revision failed, so traffic goes back to the previous revision.' || 'After the promotion, serverest.dev did not answer with the new version or did not serve the API, so traffic goes back to the previous revision.' }}

          ## Context

          |                          | Detail                                                                        	|
          |------------------------- |-------------------------------------------------------------------------------	|
          | **Failed Run**           | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} 	|
          | **Codebase**             | https://github.com/${{ github.repository }}/tree/${{ github.sha }}            	|
          | **Workflow name**        | `${{ github.workflow }}`                                                      	|
          | **Tag**                  | `${{ github.ref }}`                                                           	|
          | **Environment affected** | https://serverest.dev/                                                       	|
          | **Previous revision**    | `${{ needs.deploy-production.outputs.previous-revision }}`                    	|
          | **New revision**         | `${{ needs.deploy-production.outputs.new-revision }}`                         	|

          Manual rollback: `gcloud run services update-traffic ${{ env.SERVICE_PRODUCTION }} --region ${{ env.REGION }} --to-revisions ${{ needs.deploy-production.outputs.previous-revision }}=100`

# Rollback jobs \/

  rollback-production:
    name: Rollback production environment (serverest.dev)
    # Quem dispara é a promoção ou a conferência de roteamento que falhou, não a issue: open-issue-production
    # está aqui só para ler o número da issue, e o resultado dele não importa. Uma promoção que falha pode ter
    # deixado o tráfego pela metade; voltar para a anterior é seguro mesmo se ele nem saiu dela. O rollback da
    # vigia fica em vigiar-producao.yml.
    needs: [deploy-production, promote-production, check-routing-production, open-issue-production]
    if: ${{ always() && (needs.promote-production.result == 'failure' || needs.check-routing-production.result == 'failure') }}

    runs-on: ubuntu-22.04
    environment: production

    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GCP_IAM_SERVICE_ACCOUNT_KEY: op://CI-CD/google-cloud/SERVICE_ACCOUNT_KEY
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
    - name: Authentication on GCloud
      run: |
        echo "$GCP_IAM_SERVICE_ACCOUNT_KEY" > gcloud-service-key.json
        gcloud auth activate-service-account --key-file gcloud-service-key.json
      env:
        GCP_IAM_SERVICE_ACCOUNT_KEY: ${{ env.GCP_IAM_SERVICE_ACCOUNT_KEY }}
    - run: gcloud config set project serverest
    - name: Update production traffic to the previous revision
      # A anterior está escalada a zero: a primeira requisição espera 10 a 12 s pela instância subir.
      run: |
        gcloud run \
          services update-traffic "$SERVICE_PRODUCTION" \
          --region "$REGION" \
          --to-revisions "$PREVIOUS=100"
        gcloud run services describe "$SERVICE_PRODUCTION" --region "$REGION" --format=json | jq '.status.traffic'
      env:
        PREVIOUS: ${{ needs.deploy-production.outputs.previous-revision }}
    - name: Comment on generated issue about rollback
      if: needs.open-issue-production.outputs.issue-number != ''
      # Aqui o tráfego já voltou: um comentário que falha não pode marcar o rollback como falho.
      continue-on-error: true
      run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_NUMBER: ${{ needs.open-issue-production.outputs.issue-number }}
        BODY: |
          _This is an automatically generated comment_

          Rollback was performed in the production environment.

          Production traffic now goes to the Cloud Run revision `${{ needs.deploy-production.outputs.previous-revision }}`.

          Use the [staging environment](https://staging.serverest.dev/) for testing the failure.

  remove-canary-tag:
    name: Remove the canary tag from production
    # A URL da tag manteria a revisão alcançável por fora do domínio. Roda no fim, com sucesso ou rollback;
    # uma falha aqui não muda o resultado do deploy.
    needs:
      - deploy-production
      - test-e2e-canary
      - check-logs-canary
      - promote-production
      - check-routing-production
      - rollback-production
    if: ${{ always() && needs.deploy-production.result != 'skipped' }}

    runs-on: ubuntu-22.04
    environment: production

    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GCP_IAM_SERVICE_ACCOUNT_KEY: op://CI-CD/google-cloud/SERVICE_ACCOUNT_KEY
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
    - name: Authentication on GCloud
      run: |
        echo "$GCP_IAM_SERVICE_ACCOUNT_KEY" > gcloud-service-key.json
        gcloud auth activate-service-account --key-file gcloud-service-key.json
      env:
        GCP_IAM_SERVICE_ACCOUNT_KEY: ${{ env.GCP_IAM_SERVICE_ACCOUNT_KEY }}
    - run: gcloud config set project serverest
    - name: Remove the canary tag
      continue-on-error: true
      run: |
        gcloud run services update-traffic "$SERVICE_PRODUCTION" --region "$REGION" --remove-tags canario
        gcloud run services describe "$SERVICE_PRODUCTION" --region "$REGION" --format=json | jq '.status.traffic'

  contract-test-rollback:
    name: Contract test - Rollback 'production' tag
    needs: rollback-production
    if: ${{ always() && needs.rollback-production.result == 'success' }}

    runs-on: ubuntu-22.04

    # Why delete tag on rollback? Read: https://docs.pact.io/pact_broker/tags#handling-rollbacks
    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        PACT_BROKER_TOKEN: op://CI-CD/pactflow/PACT_BROKER_TOKEN
    - name: Delete Production tag recently created
      run: |
        curl -X DELETE https://paulogoncalves.pactflow.io/pacticipants/$PACTICIPANT/versions/$VERSION/tags/$TAG -H "Authorization: Bearer $PACT_BROKER_TOKEN"
      env:
        PACTICIPANT: ServeRest - API Rest
        VERSION: ${{ github.sha }}
        TAG: production
        PACT_BROKER_TOKEN: ${{ env.PACT_BROKER_TOKEN }}

# Rollback jobs /\

  contract-test-tag-staging:
    name: Contract test - Tag with 'staging'
    needs: deploy-staging

    runs-on: ubuntu-22.04

    steps:
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        PACT_BROKER_TOKEN: op://CI-CD/pactflow/PACT_BROKER_TOKEN
    - uses: actions/checkout@v7
    - run: docker pull pactfoundation/pact-cli:latest
    - name: Tag the pact contract with 'staging' tag
      run: |
        docker run --rm \
          -e PACT_BROKER_BASE_URL \
          -e PACT_BROKER_TOKEN \
          pactfoundation/pact-cli \
          broker create-version-tag \
          --pacticipant 'ServeRest - API Rest' \
          --version ${{ github.sha }} \
          --tag staging
      env:
        PACT_BROKER_BASE_URL: https://paulogoncalves.pactflow.io
        PACT_BROKER_TOKEN: ${{ env.PACT_BROKER_TOKEN }}

  contract-test-tag-production:
    name: Contract test - Tag with 'production'
    needs: promote-production

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Load secrets from 1password
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
        version: 2.18.0
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        PACT_BROKER_TOKEN: op://CI-CD/pactflow/PACT_BROKER_TOKEN
    - run: docker pull pactfoundation/pact-cli:latest
    - name: Tag the pact contract with 'production' tag
      run: |
        docker run --rm \
          -e PACT_BROKER_BASE_URL \
          -e PACT_BROKER_TOKEN \
          pactfoundation/pact-cli \
          broker create-version-tag \
          --pacticipant 'ServeRest - API Rest' \
          --version ${{ github.sha }} \
          --tag production
      env:
        PACT_BROKER_BASE_URL: https://paulogoncalves.pactflow.io
        PACT_BROKER_TOKEN: ${{ env.PACT_BROKER_TOKEN }}
